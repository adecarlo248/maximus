<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1E33"/>
      <stop offset="1" stop-color="#0E3A5B"/>
    </linearGradient>
    <linearGradient id="accent" x1="110" y1="120" x2="960" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .font { font-family: Inter, Arial, Helvetica, sans-serif; }
      .label { font-size: 28px; font-weight: 850; letter-spacing: 1px; }
      .title { font-size: 74px; font-weight: 950; letter-spacing: -2px; }
      .sub { font-size: 35px; font-weight: 700; }
      .small { font-size: 29px; font-weight: 600; }
      .card-title { font-size: 34px; font-weight: 950; }
      .card-text { font-size: 30px; font-weight: 800; }
      .card-note { font-size: 24px; font-weight: 650; opacity: .86; }
      .fine { font-size: 18px; font-weight: 550; opacity: .86; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="930" cy="100" r="220" fill="#38BDF8" opacity="0.12"/>
  <circle cx="120" cy="1010" r="260" fill="#22C55E" opacity="0.10"/>
  <rect x="54" y="54" width="972" height="972" rx="44" stroke="url(#accent)" stroke-width="4" opacity="0.9"/>

  <text x="92" y="126" fill="#8DEBFF" class="font label">1APP ASSOCIATE SALES PROGRAM</text>
  <text x="92" y="218" fill="white" class="font title">HELP LOCAL</text>
  <text x="92" y="300" fill="white" class="font title">BUSINESSES STOP</text>
  <text x="92" y="382" fill="url(#accent)" class="font title">MISSING LEADS</text>

  <text x="92" y="448" fill="#DDEBFF" class="font sub">Sell practical automation systems.</text>
  <text x="92" y="494" fill="#B8C7DA" class="font small">Referral pay. Sales commissions. Recurring income.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="550" width="896" height="112" rx="25" fill="#10243A" stroke="#25435E"/>
    <text x="124" y="598" fill="white" class="font card-title">Level 1</text>
    <text x="124" y="636" fill="#B8C7DA" class="font card-note">Referral Associate</text>
    <text x="420" y="596" fill="#8DEBFF" class="font card-text">$50 / $100 / $150</text>
    <text x="420" y="636" fill="#CFE7F5" class="font card-note">one-time bonus by plan</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="686" width="896" height="112" rx="25" fill="#10243A" stroke="#25435E"/>
    <text x="124" y="734" fill="white" class="font card-title">Level 2</text>
    <text x="124" y="772" fill="#B8C7DA" class="font card-note">Sales Associate</text>
    <text x="420" y="732" fill="#8DEBFF" class="font card-text">15% setup + 20% MRR</text>
    <text x="420" y="772" fill="#CFE7F5" class="font card-note">recurring capped at 12 months</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="822" width="896" height="112" rx="25" fill="#10243A" stroke="#25435E"/>
    <text x="124" y="870" fill="white" class="font card-title">Level 3</text>
    <text x="124" y="908" fill="#B8C7DA" class="font card-note">Certified Partner</text>
    <text x="420" y="868" fill="#8DEBFF" class="font card-text">20% setup + 20% MRR</text>
    <text x="420" y="908" fill="#CFE7F5" class="font card-note">lifetime + 5% direct override</text>
  </g>

  <rect x="92" y="946" width="896" height="58" rx="20" fill="url(#accent)"/>
  <text x="176" y="984" fill="#06111F" class="font card-title">DM “1APP” to apply</text>

  <text x="92" y="1024" fill="#D2E1F2" class="font fine">Independent contractor opportunity. Paid after client payment clears. Results vary.</text>
</svg>
