<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="author" content="Crust 2 Crumb Food Truck">
  <title>Crust 2 Crumb Google Review Sign</title>
  <style>
    @page{size:Letter portrait;margin:0}
    *{box-sizing:border-box}
    html,body{margin:0;width:8.5in;height:11in}
    body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#57200c}
    main{position:relative;width:8.5in;height:11in;overflow:hidden;padding:.38in .58in .42in;text-align:center;background:linear-gradient(180deg,#fff8dc 0,#fff 45%,#fff9ed 100%)}
    main:before,main:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.16}
    main:before{width:3.2in;height:3.2in;left:-1.3in;top:-1.1in;background:#f59e0b}
    main:after{width:3in;height:3in;right:-1.1in;bottom:-1.2in;background:#7fbd27}
    .content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center}
    .logo{width:2.05in;height:2.05in;object-fit:cover;border-radius:50%;background:#fff;box-shadow:0 .12in .3in rgba(87,32,12,.13)}
    .kicker{margin:.18in 0 0;font-size:.16in;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#72a91f}
    h1{margin:.07in 0 0;font-size:.54in;line-height:1.02;letter-spacing:-.025em;color:#6c260c}
    h1 span{display:block;color:#f39a0a}
    .intro{max-width:6.2in;margin:.13in auto 0;font-size:.21in;line-height:1.42;color:#774834}
    .qr-wrap{margin:.16in auto 0;padding:.15in;border:.035in solid #f4b338;border-radius:.22in;background:#fff;box-shadow:0 .12in .34in rgba(87,32,12,.11)}
    .qr{display:block;width:3.62in;height:3.62in;image-rendering:pixelated}
    .scan{margin:.13in 0 0;font-size:.27in;font-weight:900;color:#5c210c}
    .camera{margin:.045in 0 0;font-size:.17in;color:#8b604b}
    .stars{margin-top:auto;color:#f5a000;font-size:.29in;letter-spacing:.08in;line-height:1}
    .thanks{margin:.08in 0 0;font-size:.23in;font-weight:900;color:#72a91f}
    .small{margin:.055in 0 0;font-size:.13in;color:#9b7461}
  </style>
</head>
<body>
  <main>
    <div class="content">
      <img class="logo" src="Crust-2-Crumb-logo-clean.jpg" alt="Crust 2 Crumb Food Truck logo">
      <p class="kicker">Enjoyed your visit?</p>
      <h1>Loved your meal?<span>Leave us a Google review.</span></h1>
      <p class="intro">Your feedback helps our food truck grow—and helps other hungry people find Crust 2 Crumb.</p>
      <div class="qr-wrap"><img class="qr" src="Crust-2-Crumb-Google-Review-QR.png" alt="QR code for Crust 2 Crumb Google reviews"></div>
      <p class="scan">SCAN TO LEAVE A REVIEW</p>
      <p class="camera">Open your phone camera and point it at the QR code.</p>
      <div class="stars" aria-hidden="true">★★★★★</div>
      <p class="thanks">Thank you for supporting local!</p>
      <p class="small">Crust 2 Crumb Food Truck</p>
    </div>
  </main>
</body>
</html>
