<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Hub Sauce Co — Demo (self-contained)</title>
  <style>
:root{
  --bg:#0b0b0b; --muted:#9aa0a6; --neon:#ff4d6d; --accent:#00e6a8; --glass: rgba(255,255,255,0.04);
}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,Segoe UI,Arial;background:linear-gradient(180deg,#070707 0%, #0f0f14 60%);color:#eee;margin:0;min-height:100vh}
.site-header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);backdrop-filter: blur(4px)}
.logo{font-weight:800;letter-spacing:2px;font-size:20px}
.logo span{color:var(--neon)}
.btn{border:0;padding:10px 14px;border-radius:10px;background:var(--glass);color:var(--muted);cursor:pointer}
.btn.full{width:100%;background:linear-gradient(90deg,var(--neon),var(--accent));color:#050505;font-weight:700}
.btn.neon{background:linear-gradient(90deg,#ff6b86,#00e6a8);color:#050505;font-weight:700}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04)}
.container{display:grid;grid-template-columns:1fr 360px;gap:24px;padding:32px;align-items:start}
.hero{padding:44px;border-radius:12px;background:linear-gradient(90deg, rgba(255,77,109,0.06), rgba(0,230,168,0.03));box-shadow:0 10px 30px rgba(0,0,0,0.6)}
.hero h1{font-size:42px;margin:0 0 8px}
.tag{color:var(--muted);margin-bottom:18px}
.menu.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:12px;position:relative}
.product-name{font-weight:700;margin:0 0 6px}
.product-desc{color:var(--muted);font-size:13px;margin:0 0 10px}
.price{font-weight:800;color:var(--neon)}
.product-actions{display:flex;gap:8px;align-items:center}
.qty{width:56px}
.spice{display:flex;gap:6px}
.spice button{padding:6px 8px;border-radius:8px;border:0;background:#111;color:var(--muted);cursor:pointer}
.cart{background:#070708;padding:18px;border-radius:12px;border-left:1px solid rgba(255,255,255,0.03)}
.cart h3{margin-top:0}
.cart-items{min-height:120px}
.cart-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,0.03)}
.total{font-weight:800;margin:12px 0}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,2,2,0.6);opacity:0;pointer-events:none;transition:opacity .18s}
.modal[aria-hidden="false"]{opacity:1;pointer-events:auto}
.modal-body{background:#0b0b0b;padding:22px;border-radius:12px;width:420px;box-shadow:0 18px 60px rgba(0,0,0,0.7)}
.modal .close{position:absolute;right:14px;top:14px;background:transparent;border:0;color:var(--muted);font-size:18px}
label{display:block;margin-bottom:10px}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:#eee}
.form-actions{margin-top:10px}
.hidden{display:none}

/* small */
@media(max-width:900px){.container{grid-template-columns:1fr;}.cart{order:2;width:100%}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo">HUB<span>SAUCE</span></div>
    <nav>
      <button id="view-menu" class="btn ghost">Menu</button>
      <button id="view-order" class="btn">Order Now</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Bold flavours. Fast ordering.</h1>
      <p class="tag">The Hub Sauce Co — handcrafted hot sauces & condiments.</p>
      <button id="start-order" class="btn neon">Build your order</button>
    </section>

    <section class="menu grid" id="menu">
      <!-- products inserted by JS -->
    </section>

    <aside class="cart" id="cart">
      <h3>Your Order</h3>
      <div id="cart-items" class="cart-items">Empty — add something spicy 🔥</div>
      <div class="cart-footer">
        <div class="total">Total: $<span id="total">0.00</span></div>
        <button id="checkout" class="btn full">Checkout</button>
      </div>
    </aside>
  </main>

  <div class="modal" id="checkout-modal" aria-hidden="true">
    <div class="modal-body">
      <button class="close" id="close-modal">✕</button>
      <h2>Checkout — quick & clean</h2>
      <form id="checkout-form">
        <label>Full name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Phone (optional)<input name="phone" type="tel"></label>
        <label>Notes / Delivery instructions<textarea name="notes"></textarea></label>
        <div class="form-actions">
          <button type="submit" class="btn neon full">Place order</button>
        </div>
      </form>
      <div id="order-confirm" class="hidden">
        <h3>Order received ✨</h3>
        <p id="order-summary"></p>
        <button id="new-order" class="btn">New order</button>
      </div>
    </div>
  </div>

  <script>
const PRODUCTS = [
  {id:1,name:'Smash Hot',desc:'Garlicky cayenne blast',price:9.99},
  {id:2,name:'Blackout BBQ',desc:'Smoke, molasses, attitude',price:11.99},
  {id:3,name:'Zest Riot',desc:'Citrus + habanero tang',price:10.99},
  {id:4,name:'Midnight Mango',desc:'Sweet heat, tropical kick',price:12.49}
];

const menuEl = document.getElementById('menu');
const cartEl = document.getElementById('cart-items');
const totalEl = document.getElementById('total');
const checkoutBtn = document.getElementById('checkout');
const checkoutModal = document.getElementById('checkout-modal');
const checkoutForm = document.getElementById('checkout-form');
const orderConfirm = document.getElementById('order-confirm');
const orderSummary = document.getElementById('order-summary');

let cart = [];

function renderMenu(){
  menuEl.innerHTML = '';
  PRODUCTS.forEach(p=>{
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `
      <div class="product-name">${p.name}</div>
      <div class="product-desc">${p.desc}</div>
      <div class="price">$${p.price.toFixed(2)}</div>
      <div class="product-actions">
        <div class="spice">
          <button data-spice="mild">Mild</button>
          <button data-spice="hot">Hot</button>
          <button data-spice="insane">Insane</button>
        </div>
        <input class="qty" type="number" min="1" value="1">
        <button class="btn" data-id="${p.id}">Add</button>
      </div>`;
    menuEl.appendChild(card);
    card.querySelector('[data-id]').addEventListener('click',()=>{
      const qty = Number(card.querySelector('.qty').value)||1;
      const spice = card.querySelector('[data-spice].active')?.dataset.spice || card.querySelector('[data-spice]').dataset.spice;
      addToCart(p,qty,spice);
    });
    card.querySelectorAll('[data-spice]').forEach(b=>b.addEventListener('click',e=>{card.querySelectorAll('[data-spice]').forEach(x=>x.classList.remove('active'));e.target.classList.add('active')}));
  });
}

function addToCart(product, qty=1, spice='mild'){
  const existing = cart.find(i=>i.id===product.id && i.spice===spice);
  if(existing) existing.qty += qty; else cart.push({id:product.id,name:product.name,price:product.price,qty,spice});
  renderCart();
}

function renderCart(){
  if(cart.length===0){cartEl.innerHTML='Empty — add something spicy 🔥'; totalEl.textContent='0.00'; return}
  cartEl.innerHTML='';
  let total=0;
  cart.forEach(item=>{
    const row = document.createElement('div'); row.className='cart-item';
    row.innerHTML = `<div>${item.name} <small style="color:#9aa0a6">×${item.qty} • ${item.spice}</small></div><div>$${(item.price*item.qty).toFixed(2)}</div>`;
    cartEl.appendChild(row);
    total += item.price*item.qty;
  });
  totalEl.textContent = total.toFixed(2);
}

document.getElementById('start-order').addEventListener('click',()=>{document.getElementById('menu').scrollIntoView({behavior:'smooth'})});
document.getElementById('view-order').addEventListener('click',()=>{document.getElementById('cart').scrollIntoView({behavior:'smooth'})});
checkoutBtn.addEventListener('click',()=>{
  if(cart.length===0){alert('Add something first.');return}
  checkoutModal.setAttribute('aria-hidden','false');
});
document.getElementById('close-modal').addEventListener('click',()=>checkoutModal.setAttribute('aria-hidden','true'));

checkoutForm.addEventListener('submit',e=>{
  e.preventDefault();
  const fd = new FormData(checkoutForm); const name=fd.get('name');
  const email=fd.get('email'); const phone=fd.get('phone'); const notes=fd.get('notes');
  const summary = cart.map(i=>`${i.qty}× ${i.name} (${i.spice})`).join('\n');
  orderSummary.textContent = `Thanks ${name}!\nOrder:\n${summary}\nNotes: ${notes || '—'}\nWe will email ${email}${phone?(' • '+phone):''}`;
  checkoutForm.classList.add('hidden'); orderConfirm.classList.remove('hidden');
});

document.getElementById('new-order').addEventListener('click',()=>{
  cart=[]; renderCart(); checkoutForm.reset(); checkoutForm.classList.remove('hidden'); orderConfirm.classList.add('hidden'); checkoutModal.setAttribute('aria-hidden','true');
});

// initial
renderMenu(); renderCart();
  </script>
</body>
</html>
